<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Darul Ifta ERP Dashboard</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ========================================================
           FONT SETUP (Urdu + English)
           ======================================================== */
        @font-face {
            font-family: 'Jameel Noori Nastaleeq';
            src: url('https://cdn.jsdelivr.net/gh/urduhack/urdu-fonts@master/jameel_noori_nastaleeq/JameelNooriNastaleeq.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* ========================================================
           NEW FUTURISTIC TEAL/CYAN THEME
           ======================================================== */
        :root {
            --bg-main: #0b2e2a;
            --bg-gradient: radial-gradient(circle at center, #1b5b54 0%, #061e1b 100%);
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-hover: rgba(255, 255, 255, 0.2);
            --gold-primary: #5ce1d3;
            --gold-light: #ffffff;
            --gold-glow: rgba(92, 225, 211, 0.5);
            --text-white: #ffffff;
            --text-muted: #a6d8d2;
            --border-color: rgba(92, 225, 211, 0.3);
            --input-bg: rgba(0, 0, 0, 0.3);
            --input-border: rgba(92, 225, 211, 0.4);
            --table-header-bg: linear-gradient(180deg, rgba(27, 91, 84, 0.9), rgba(11, 46, 42, 0.9));
            --table-border: rgba(92, 225, 211, 0.2);
            --photo-border: var(--gold-primary);
        }

        /* LIGHT MODE THEME */
        body.light-mode {
            --bg-main: #e0f2f1;
            --bg-gradient: linear-gradient(135deg, #b2dfdb 0%, #ffffff 100%);
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-hover: rgba(255, 255, 255, 0.9);
            --gold-primary: #00796b;
            --gold-light: #004d40;
            --gold-glow: rgba(0, 121, 107, 0.2);
            --text-white: #004d40;
            --text-muted: #00695c;
            --border-color: rgba(0, 121, 107, 0.3);
            --input-bg: rgba(255, 255, 255, 0.8);
            --input-border: rgba(0, 121, 107, 0.4);
            --table-header-bg: linear-gradient(180deg, #00796b, #004d40);
            --table-border: rgba(0, 121, 107, 0.2);
            --photo-border: #00796b;
        }

        /* Global Resets */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background: var(--bg-gradient);
            background-color: var(--bg-main);
            color: var(--text-white);
            overflow-x: hidden;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.4s ease;
            position: relative;
        }
        
        /* Enforcing Jameel Noori Nastaleeq for Specific Urdu Text globally */
        .urdu-text, .urdu-3d, .urdu-th, .urdu-setting, .urdu-btn, .nm-name, .nm-row, .nm-label, .header h1 {
            font-family: 'Jameel Noori Nastaleeq', Arial, sans-serif !important;
        }
        
        /* Explicit Poppins class for English Text */
        .eng-text {
            font-family: 'Poppins', sans-serif !important;
        }

        /* ========================================================
           3D REALISTIC EMOJI CSS (For Images)
           ======================================================== */
        .box-icon img { width: 55px; height: 55px; object-fit: contain; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.6)); transition: 0.3s ease; }
        .menu-box:hover .box-icon img { transform: scale(1.15) translateY(-5px); }
        .social-summary-icon img { width: 45px; height: 45px; object-fit: contain; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.5)); }
        .tab-icon img { width: 32px; height: 32px; object-fit: contain; margin-bottom: 5px; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.4)); }
        .notif-icon img { width: 35px; height: 35px; object-fit: contain; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)); }
        .settings-header .icon img { width: 38px; height: 38px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
        .sm-icon-wrapper img { width: 35px; height: 35px; object-fit: contain; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.4)); }
        .fatwa-card .box-icon img { width: 65px; height: 65px; }
        .status-badge i img { width: 18px; height: 18px; vertical-align: middle; margin-right: 5px; }
        .btn-action img, .btn-bottom img { width: 20px; height: 20px; object-fit: contain; vertical-align: middle; margin-right: 5px; }
        .ws-alert-icon img { width: 26px; height: 26px; object-fit: contain; }

        /* ========================================================
           EDITABLE CONTENT CSS
           ======================================================== */
        [contenteditable="true"] {
            cursor: text;
            transition: all 0.3s ease;
            outline: none;
            border-bottom: 1px dashed transparent;
        }
        [contenteditable="true"]:hover {
            border-bottom: 1px dashed var(--gold-primary);
        }
        [contenteditable="true"]:focus {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            padding: 2px 6px;
            border-bottom: 1px solid var(--gold-primary);
            box-shadow: inset 0 0 10px var(--gold-glow);
        }
        body.light-mode [contenteditable="true"]:focus {
            background: rgba(255, 255, 255, 0.8);
        }

        /* ========================================================
           FUTURISTIC TECH BACKGROUND RINGS
           ======================================================== */
        .tech-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tech-bg::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .r1 { width: 40vw; height: 40vw; border: 2px dashed rgba(92, 225, 211, 0.2); animation: spin 60s linear infinite; }
        .r2 { width: 60vw; height: 60vw; border: 1px solid rgba(92, 225, 211, 0.15); animation: spin-reverse 90s linear infinite; }
        .r3 { width: 80vw; height: 80vw; border: 3px dotted rgba(255,255,255,0.05); animation: spin 120s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

        /* ========================================================
           PREMIUM BOX (Glassmorphism styling)
           ======================================================== */
        .premium-box {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 2px 10px rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        body.light-mode .premium-box {
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            border-color: rgba(0,121,107,0.2);
        }
        .premium-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: skewX(-25deg);
            transition: 0.6s;
            pointer-events: none;
        }
        .premium-box:hover::before { left: 125%; }
        .premium-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px var(--gold-glow);
        }

        /* LOGIN PAGE */
        #login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: absolute;
            width: 100%;
            z-index: 1000;
            transition: opacity 0.5s ease;
            padding: 20px;
        }
        .login-box {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px var(--gold-glow);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: slideUp 0.8s ease;
        }
        .login-box img {
            max-width: 130px;
            margin-bottom: 20px;
            border-radius: 50%;
            box-shadow: 0 0 20px var(--gold-glow);
            border: 2px solid var(--gold-primary);
        }
        .login-box h2 {
            color: var(--gold-light);
            margin-bottom: 25px;
            font-size: 24px;
            text-shadow: 0 0 10px var(--gold-glow);
            font-weight: 600;
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            display: block;
            color: var(--gold-primary);
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 13px;
        }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-white);
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 12px var(--gold-glow);
            background: rgba(0,0,0,0.6);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--gold-primary), #2980b9);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(92,225,211,0.3);
        }
        body:not(.light-mode) .login-btn { color: #fff; }
        .login-btn:hover {
            box-shadow: 0 0 20px var(--gold-glow);
            filter: brightness(1.15);
            transform: translateY(-2px);
        }

        /* MAIN LAYOUT */
        #dashboard-page,
        #whatsapp-report-page,
        #muftiyan-page,
        #branches-page,
        #settings-page,
        #social-media-page,
        #whatsapp-suwalat-page,
        #reports-page {
            display: none;
            height: 100vh;
        }
        
        .main {
            width: 100%;
            padding: 20px 40px;
            height: 100vh;
            overflow-y: auto;
            animation: fadeIn 0.6s ease;
            position: relative;
            z-index: 1;
        }
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            position: relative;
        }
        .header h1 {
            color: var(--gold-primary);
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0px 2px 15px var(--gold-glow);
            margin: 0;
            text-align: center;
        }
        .header-right, .header-left {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-right { right: 0; }
        .header-left { left: 0; }
        
        .theme-toggle-btn, .lang-select, .btn-back {
            padding: 8px 15px;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            font-size: 13px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .theme-toggle-btn:hover, .btn-back:hover {
            background: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 15px var(--gold-glow);
        }
        
        /* HEXAGONAL DASHBOARD MENU */
        .menu-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }
        .menu-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            width: 190px;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
        }
        .menu-box::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(0,0,0,0.2));
            border-radius: 14px;
            z-index: -1;
        }
        .menu-box:hover {
            transform: scale(1.08);
            background: rgba(92, 225, 211, 0.25);
            z-index: 10;
            box-shadow: 0 12px 35px var(--gold-glow);
        }
        body.light-mode .menu-box { background: rgba(0, 121, 107, 0.15); }
        body.light-mode .menu-box:hover { background: rgba(0, 121, 107, 0.3); }

        .text-3d {
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .urdu-3d {
            font-size: 22px;
            color: #ffffff;
            font-weight: bold;
            transition: 0.3s;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }
        .menu-box:hover .urdu-3d, .menu-box:hover .text-3d {
            text-shadow: 0 0 10px #fff;
        }
        
        /* COMMON TOOLBAR & TABLE */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .toolbar-group {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .input-control {
            padding: 10px 15px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-white);
            font-size: 13px;
            outline: none;
            backdrop-filter: blur(5px);
        }
        .input-control:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 8px var(--gold-glow);
            background: rgba(0,0,0,0.6);
        }
        select.input-control option, select.table-input option {
            background: #0b2e2a;
            color: #fff;
        }
        body.light-mode select.input-control option, body.light-mode select.table-input option {
            background: #fff;
            color: #000;
        }
        
        .btn-action {
            padding: 10px 18px;
            border: 1px solid var(--gold-primary);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(92, 225, 211, 0.1);
            color: var(--gold-primary);
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }
        .btn-action:hover {
            background: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 15px var(--gold-glow);
            transform: translateY(-2px);
        }
        body:not(.light-mode) .btn-action:hover { color: #000; }

        .btn-reset {
            border-color: #ff4d4d;
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
            margin-left: 10px;
        }
        .btn-reset:hover {
            background: #ff4d4d;
            color: #fff;
            box-shadow: 0 0 15px rgba(255,77,77,0.5);
        }

        /* ========================================================
           SCREEN ADJUSTMENT (COMPACT TABLE FOR BETTER VIEWING)
           ======================================================== */
        .table-container, .sm-table-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            transition: opacity 0.4s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        
        .table-container::-webkit-scrollbar, .sm-table-container::-webkit-scrollbar {
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track, .sm-table-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb, .sm-table-container::-webkit-scrollbar-thumb {
            background: var(--gold-primary);
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover, .sm-table-container::-webkit-scrollbar-thumb:hover {
            background: #1abc9c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1050px;
        }
        table th {
            background: var(--table-header-bg);
            color: #fff;
            padding: 8px 4px;
            text-align: center;
            font-size: 11px;
            border-bottom: 2px solid var(--gold-primary);
            border-right: 1px solid rgba(255,255,255,0.1);
            vertical-align: middle;
            white-space: nowrap;
        }
        table th .urdu-th {
            font-size: 16px;
            display: block;
            margin-top: 2px;
            font-weight: normal;
            color: var(--gold-primary);
            line-height: 1.2;
            text-shadow: 0 1px 2px #000;
        }
        body.light-mode table th .urdu-th {
            color: #d1e7dd;
            text-shadow: none;
        }
        
        table td {
            padding: 2px 4px;
            border-bottom: 1px solid var(--table-border);
            border-right: 1px solid var(--table-border);
            color: var(--text-white);
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            vertical-align: middle;
        }
        
        .table-input {
            width: 100%;
            min-width: 50px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(92,225,211,0.3);
            color: var(--text-white);
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            padding: 3px 4px;
            transition: 0.3s;
            pointer-events: auto;
            opacity: 1;
        }
        .table-input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 8px var(--gold-glow);
            background: rgba(0,0,0,0.8);
        }

        .col-pending { color: #ffc107 !important; background: rgba(255, 193, 7, 0.1) !important; border-color: rgba(255, 193, 7, 0.4) !important; }
        .col-correct { color: #2ecc71 !important; background: rgba(46, 204, 113, 0.1) !important; border-color: rgba(46, 204, 113, 0.4) !important; }
        .col-wrong { color: #e74c3c !important; background: rgba(231, 76, 60, 0.1) !important; border-color: rgba(231, 76, 60, 0.4) !important; }
        .col-edited { color: #9b59b6 !important; background: rgba(155, 89, 182, 0.1) !important; border-color: rgba(155, 89, 182, 0.4) !important; }
        
        /* ========================================================
           REPORTS MODULE TABS
           ======================================================== */
        .report-tabs-wrapper {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .report-tab {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-white);
            padding: 15px 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            min-width: 150px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .report-tab:hover {
            border-color: var(--gold-primary);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px var(--gold-glow);
        }
        .report-tab.active-tab {
            background: rgba(92, 225, 211, 0.2);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            box-shadow: 0 0 20px var(--gold-glow);
        }
        .report-tab .tab-icon { font-size: 28px; margin-bottom: 8px; display: block; }
        .report-tab .tab-title-en { font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .report-tab .tab-title-ur { font-size: 20px; font-family: 'Jameel Noori Nastaleeq'; margin-top: 4px; }
        .report-section { display: none; animation: fadeIn 0.5s ease; }

        /* MUFTIYAN CARDS */
        .nm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        .nm-card {
            display: flex;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            direction: rtl;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transition: 0.3s ease;
            min-height: 160px;
            perspective: 1000px;
        }
        .nm-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px var(--gold-glow);
            border-color: var(--gold-primary);
        }
        .nm-photo {
            width: 35%;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.2);
            border-left: 1px solid var(--border-color);
            padding: 10px;
        }
        .nm-photo img {
